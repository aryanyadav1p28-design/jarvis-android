name: Build and Release JARVIS Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - jarvis-windows-app
    paths:
      - "windows-app/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set unique version for this build
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Publish release for auto-updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: JARVIS Desktop ${{ env.APP_VERSION }}
          target_commitish: jarvis-windows-app
          generate_release_notes: true
          make_latest: true
          files: |
            windows-app/dist/*.exe
            windows-app/dist/latest.yml
            windows-app/dist/*.blockmap
