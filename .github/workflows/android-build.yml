name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, jarvis-ai-prep]
    paths:
      - '**.kt'
      - '**.kts'
      - 'app/src/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
      JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
      JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
      JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        run: |
          mkdir -p signing
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > signing/jarvis-signing.jks
            if [ ! -s signing/jarvis-signing.jks ] || [ -z "$JARVIS_KEYSTORE_PASSWORD" ] || [ -z "$JARVIS_KEY_ALIAS" ] || [ -z "$JARVIS_KEY_PASSWORD" ]; then
              echo "Stable signing secrets are incomplete." >&2
              exit 1
            fi
            echo "Stable signing key loaded from GitHub Actions secrets."
            keytool -list -v -keystore signing/jarvis-signing.jks -storepass "$JARVIS_KEYSTORE_PASSWORD" -alias "$JARVIS_KEY_ALIAS" | grep -E 'SHA1:|SHA-1:'
          else
            echo "WARNING: stable signing secrets are not configured; this build will use a temporary debug key. Its OAuth SHA-1 will change on future runs."
            ANDROID_CONFIG_DIR="$HOME/.config/android"
            mkdir -p "$ANDROID_CONFIG_DIR" "$HOME/.android"
            keytool -genkeypair -noprompt -keystore "$ANDROID_CONFIG_DIR/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp "$ANDROID_CONFIG_DIR/debug.keystore" "$HOME/.android/debug.keystore"
            echo "ANDROID_USER_HOME=$ANDROID_CONFIG_DIR" >> "$GITHUB_ENV"
            keytool -list -v -keystore "$ANDROID_CONFIG_DIR/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'
          fi

      - name: Show Gradle signing report
        run: gradle signingReport

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
