name: Deploy JARVIS Cloud Brain

on:
  push:
    branches:
      - cloud-ai-brain
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-jarvis-cloud-brain.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Worker
        working-directory: cloudflare-worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
